<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Maintenance Research Stats Tool</title>
    <!-- Tailwind CSS UI ke liye -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">📊 Client-Side Research Stats Analyzer</h2>
        <p class="text-sm text-gray-500 mb-4">Numbers ko comma (,) se separate karke enter karein. Koi data server par nahi jata.</p>
        
        <textarea id="dataInput" class="w-full p-3 border rounded mb-4 h-28" placeholder="E.g., 12, 15, 24, 14, 25, 34, 15, 28, 19"></textarea>
        <button onclick="calculateStats()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">Analyze Data</button>

        <div id="results" class="mt-6 hidden space-y-2 border-t pt-4">
            <h3 class="text-lg font-semibold text-gray-700">Results:</h3>
            <p><strong>Mean (Average):</strong> <span id="meanOut">-</span></p>
            <p><strong>Median (Middle Value):</strong> <span id="medianOut">-</span></p>
            <p><strong>Standard Deviation (SD):</strong> <span id="sdOut">-</span></p>
        </div>
    </div>

    <script>
        function calculateStats() {
            const input = document.getElementById('dataInput').value;
            // String ko numbers ke array me convert karna
            const numbers = input.split(',').map(num => parseFloat(num.trim())).filter(num => !isNaN(num));

            if (numbers.length === 0) {
                alert("Kripya valid numbers enter karein!");
                return;
            }

            // 1. Mean Calculation
            const sum = numbers.reduce((a, b) => a + b, 0);
            const mean = sum / numbers.length;

            // 2. Median Calculation
            const sorted = [...numbers].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            const median = sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;

            // 3. Standard Deviation Calculation
            const variance = numbers.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / numbers.length;
            const stdDev = Math.sqrt(variance);

            // UI Update
            document.getElementById('meanOut').innerText = mean.toFixed(4);
            document.getElementById('medianOut').innerText = median.toFixed(4);
            document.getElementById('sdOut').innerText = stdDev.toFixed(4);
            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
