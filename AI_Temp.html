<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless AI Chatbot</title>
    <!-- Tailwind CSS for Beautiful UI -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Smooth scrolling for chat window */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 text-center border-b border-slate-200">
        <h1 class="text-xl font-bold text-slate-800 flex items-center justify-center gap-2">
            🤖 Serverless Cloudflare AI Chatbot
        </h1>
        <p class="text-xs text-slate-500 mt-1">Powered by Llama 3 & Serverless JavaScript</p>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-box" class="chat-box flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full">
        <!-- System Greeting -->
        <div class="flex items-start gap-2.5">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold">AI</div>
            <div class="flex flex-col w-full max-w-[450px] leading-1.5 p-4 border-gray-200 bg-white rounded-e-xl rounded-es-xl shadow-xs">
                <p class="text-sm font-normal text-gray-900">Hello! I am your serverless AI assistant. How can I help you today?</p>
            </div>
        </div>
    </main>

    <!-- Input Footer Area -->
    <footer class="bg-white p-4 border-t border-slate-200 sticky bottom-0">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your prompt here..." 
                required 
                class="flex-1 bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center shadow-md transition-all"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // ⚠️ अपनी डिप्लॉयड CLOUDFLARE WORKER URL यहाँ पेस्ट करें ⚠️
        const CLOUDFLARE_WORKER_URL = "https://sinsigma-com.shivhare-dushyantkumar.workers.dev";

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // चैट हिस्ट्री स्टोर करने के लिए एरे (Context याद रखने के लिए)
        let chatHistory = [];

        // स्क्रीन पर मैसेज रेंडर करने का फ़ंक्शन
        function appendMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = role === 'user' ? 'flex items-start gap-2.5 justify-end' : 'flex items-start gap-2.5';

            const avatarBg = role === 'user' ? 'bg-slate-700' : 'bg-blue-600';
            const avatarText = role === 'user' ? 'ME' : 'AI';
            const bubbleBg = role === 'user' ? 'bg-slate-700 text-white rounded-s-xl rounded-ee-xl' : 'bg-white text-gray-900 rounded-e-xl rounded-es-xl border border-gray-200';

            messageDiv.innerHTML = `
                ${role !== 'user' ? `<div class="w-8 h-8 rounded-full ${avatarBg} flex items-center justify-center text-white text-sm font-bold shrink-0"> ${avatarText}</div>` : ''}
                <div class="flex flex-col w-full max-w-[450px] leading-1.5 p-4 ${bubbleBg} shadow-xs">
                    <p class="text-sm font-normal">${text}</p>
                </div>
                ${role === 'user' ? `<div class="w-8 h-8 rounded-full ${avatarBg} flex items-center justify-center text-white text-xs font-bold shrink-0"> ${avatarText}</div>` : ''}
            `;

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // ऑटो स्क्रॉल नीचे की तरफ
        }

        // फॉर्म सबमिट होने पर
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // 1. यूज़र का मैसेज स्क्रीन पर दिखाएँ
            appendMessage('user', prompt);
            userInput.value = '';

            // हिस्ट्री अपडेट करें
            chatHistory.push({ role: 'user', content: prompt });

            // बटन को डिसेबल और लोडिंग स्टेट में डालें
            sendBtn.disabled = true;
            sendBtn.innerText = "Thinking...";
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // 2. लोडिंग इंडिकेटर स्क्रीन पर दिखाएँ
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex items-start gap-2.5';
            loadingDiv.id = 'loading-bubble';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold shrink-0">AI</div>
                <div class="flex flex-col w-full max-w-[100px] leading-1.5 p-4 bg-white rounded-e-xl rounded-es-xl border border-gray-200 shadow-xs">
                    <p class="text-sm font-normal text-gray-500 animate-pulse">Typing...</p>
                </div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. Cloudflare Worker API को कॉल करें
                const response = await fetch(CLOUDFLARE_WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();
                
                // लोडिंग बबल को हटाएँ
                document.getElementById('loading-bubble').remove();

                if (data.response || data.result?.response) {
                    const aiReply = data.response || data.result.response;
                    
                    // 4. AI का रिप्लाई स्क्रीन पर दिखाएँ
                    appendMessage('assistant', aiReply);
                    // हिस्ट्री में AI का जवाब सेव करें
                    chatHistory.push({ role: 'assistant', content: aiReply });
                } else {
                    appendMessage('assistant', '⚠️ Error: URL configuration or Invalid response structure.');
                }

            } catch (error) {
                if (document.getElementById('loading-bubble')) document.getElementById('loading-bubble').remove();
                appendMessage('assistant', '❌ Could not connect to your Cloudflare Worker. Please check your Worker URL.');
                console.error(error);
            } finally {
                // बटन वापस नॉर्मल करें
                sendBtn.disabled = false;
                sendBtn.innerText = "Send";
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
